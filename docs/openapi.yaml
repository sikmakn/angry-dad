          description: Единственный допустимый переход — остановка повторяющейся задачи
          enum:
            - stopped
          type: string
        title:
          maxLength: 120
          minLength: 1
          type: string
      type: object
    WeakSpot:
      properties:
        description:
          minLength: 1
          type: string
        key:
          minLength: 1
          type: string
      required:
