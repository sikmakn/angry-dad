          name: status
          required: false
          schema:
            enum:
              - active
              - stopped
              - closed
            type: string
        - in: query
          name: kind
          required: false
          schema:
            enum:
              - one_time
              - recurring
            type: string
        - in: query
          name: sort
          required: false
          schema:
            enum:
              - deadline
              - -createdAt
            type: string
