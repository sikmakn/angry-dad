openapi: 3.0.0
info:
  contact: {}
  description: "HTTP API Mini App и вебхука «Батя». Источник контракта — реальные NestJS controllers/DTO. Mini App передаёт Authorization: tma <initData>. Неизвестный Telegram ID создаёт гостя. Операции с завершённым стартом дают гостю 403 onboarding_required. /owner требует совпадения Telegram ID с настроенным ownerId, иначе 403 owner_only. reply — готовый текст персонажа; null означает молчание."
  title: angry-dad
  version: 0.1.0
servers:
  - url: /api
tags: []
security:
  - telegramInitData: []
paths:
  /battle/{role}:
    get:
      description: "Диалог текущей роли, иначе 409 role_mismatch. defeat учитывает откат 25 пунктов в сутки; defeatAt — последняя запись. Первое обращение к пустому диалогу через эту операцию или listBattleMessages атомарно и однократно добавляет onBattleStart до ответа. Повторы не добавляют приветствие. Уровни 1–4: границы 0/20/50/80. Требует завершённый старт."
      operationId: getBattleDialog
      parameters:
        - in: path
          name: role
          required: true
          schema:
            enum:
              - father
              - mother
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleDialogResponse"
          description: Диалог
        "400":
          content:
            application/problem+json:
              examples:
                vague:
                  value:
                    reply: Это что за задача? Конкретно.
                    status: 400
                    title: task vague
                    type: urn:angry-dad:problem:task_vague
                validation:
                  value:
                    errors:
                      - field: timeZone
                        message: timeZone must be a valid IANA time zone
                    status: 400
                    title: validation failed
                    type: urn:angry-dad:problem:validation_failed
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Неверный запрос: validation_failed, task_vague, deadline_out_of_range. Ошибки валидации могут содержать errors; task_vague — reply."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized. Нет или не годятся данные Telegram: unauthorized либо init_data_expired. Получите свежие данные запуска."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden. Нет прав: onboarding_required для гостя, owner_only для не-владельца."
        "409":
          content:
            application/problem+json:
              examples:
                closed:
                  value:
                    periodStatus: failed
                    status: 409
                    title: period not active
                    type: urn:angry-dad:problem:period_not_active
                noStrikes:
                  value:
                    status: 409
                    title: insufficient strikes
                    type: urn:angry-dad:problem:insufficient_strikes
              schema:
                $ref: "#/components/schemas/Problem"
          description: "role_mismatch: доступен только диалог текущей роли пользователя. Конфликт состояния: period_not_active, extension_denied, retry_unavailable, already_rated, already_onboarded, last_enabled_phrase, insufficient_strikes, revoke_exceeds_balance, refund_not_allowed, role_mismatch, turn_in_progress, idempotency_key_reused."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "internal_error: внутренняя ошибка без раскрытия подробностей."
      summary: Диалог боя
      tags:
        - battle
