            - urn:angry-dad:problem:unauthorized
            - urn:angry-dad:problem:not_found
            - urn:angry-dad:problem:internal_error
            - urn:angry-dad:problem:already_onboarded
            - urn:angry-dad:problem:init_data_expired
            - urn:angry-dad:problem:onboarding_required
            - urn:angry-dad:problem:owner_only
            - urn:angry-dad:problem:deadline_out_of_range
            - urn:angry-dad:problem:extension_denied
            - urn:angry-dad:problem:period_not_active
