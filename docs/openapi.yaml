          description: |
            Тихие часы в минутах от полуночи местного времени, шаг 30. Интервал от начала до конца
            (через полночь тоже) любой длины; если начало и конец совпадают, тихих часов нет.
        role:
          description: Вредный родитель
          enum:
            - father
            - mother
          type: string
        timeZone:
          description: IANA-зона
          type: string
      type: object
    UpdatePhraseRequest:
      properties:
        status:
          enum:
            - enabled
            - disabled
          type: string
      required:
        - status
      type: object
    UpdateSupportTicketRequest:
      properties:
        status:
          enum:
            - open
            - resolved
          type: string
      required:
        - status
      type: object
    UpdateTaskRequest:
      properties:
