          maximum: 100
          minimum: 0
          multipleOf: 0.5
          type: number
        respectDelta:
          description: Изменение уважения за ход, включая +12 за слом
          multipleOf: 0.5
          type: number
        strikesBalance:
          description: Баланс ударов после хода
          minimum: 0
          type: integer
      required:
        - damage
        - defeatBefore
        - defeatAfter
        - mode
        - respectDelta
        - respect
        - messages
        - strikesBalance
      type: object
    UpdateMeRequest:
      properties:
