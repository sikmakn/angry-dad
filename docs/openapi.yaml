    TaskActionResponse:
      properties:
        reply:
          description: Фраза персонажа (onTaskSet при постановке, onDelete при остановке), `null` при переименовании
          nullable: true
          type: string
        task:
          allOf:
            - $ref: "#/components/schemas/TaskResponse"
          description: |
            Задача. `currentPeriod` вложен как исключение из правила «чужую модель не вкладывать»:
            главная страница показывает таймер и настроение каждой активной задачи (25 и более) и
            открывается за один запрос (A4, N-5). Для остальных периодов — `listTaskPeriods`.
            Для остановленной и закрытой задачи это последний период.
      required:
        - task
        - reply
      type: object
    TaskListResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/TaskResponse"
          type: array
        nextCursor:
          nullable: true
          type: string
      required:
        - items
        - nextCursor
      type: object
    TaskResponse:
      properties:
        anchorTime:
          description: Ориентир, время суток ЧЧ:ММ в поясе пользователя
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          type: string
        createdAt:
          format: date-time
          type: string
        currentPeriod:
          allOf:
            - $ref: "#/components/schemas/PeriodResponse"
          description: |
            Один срок задачи. Настроение клиент считает сам: от `moodFrom` до `anchorAt` (если есть,
            иначе до `deadline`): до 25% — neutral, до 60% — watching, до 85% — annoyed, до 100% —
            angry; после этого срока и после `deadline` — very_angry.
        id:
          type: string
        kind:
          enum:
            - one_time
            - recurring
          type: string
        nextPeriodStartsAt:
          description: |
            Начало следующего периода. Есть у активной повторяющейся задачи, когда активного
            периода сейчас нет (например «по будням» в субботу): тогда `currentPeriod` — последний
            закрытый период. Вычисляется сервером по правилам периодов.
          format: date-time
          type: string
        recurrence:
          allOf:
            - $ref: "#/components/schemas/Recurrence"
          description: |
            `daily` — каждый день; `weekdays` — по будням; `weekly` — раз в неделю (`days` из одного
            дня недели или без `days` — календарная неделя); `days_of_week` — выбранные дни (`days`
            от 1 до 6 значений); `every_n_days` — окно из `n` дней (от 2 до 30).
        size:
          description: Размер определяет лёгкая модель при постановке; награда за закрытие +1, +3, +5 уважения
          enum:
            - micro
            - medium
            - large
          type: string
        status:
          enum:
            - active
            - stopped
            - closed
          type: string
        title:
          type: string
      required:
        - id
        - title
        - kind
        - size
        - status
        - createdAt
      type: object
    TelegramUpdate:
      properties:
        update_id:
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - update_id
      type: object
