components:
  schemas:
    BattleDialogResponse:
      properties:
        defeat:
          description: Побеждённость на момент запроса, с учётом отката
          maximum: 100
          minimum: 0
          type: number
        defeatAt:
          format: date-time
          type: string
        mode:
          enum:
            - aggression
            - defense
            - confusion
            - softening
          type: string
        role:
          description: Вредный родитель
          enum:
            - father
            - mother
          type: string
        turnInProgress:
          description: Ход этого диалога идёт сейчас; кнопка отправки неактивна
          type: boolean
      required:
        - role
        - mode
        - turnInProgress
        - defeat
        - defeatAt
      type: object
    BattleMessageListResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/BattleMessageResponse"
          type: array
        nextCursor:
          nullable: true
          type: string
      required:
        - items
        - nextCursor
      type: object
    BattleMessageResponse:
      properties:
        author:
          enum:
            - player
            - character
          type: string
        origin:
          enum:
            - turn
            - reply_to_feed
            - battle_start
            - break
          type: string
        seq:
          description: Порядковый номер реплики в диалоге
          minimum: 1
          type: integer
        taskTitle:
          description: Название задачи для реплики из «Истории»
          type: string
        text:
          type: string
      required:
        - seq
        - author
        - text
        - origin
      type: object
    CheckInAnswerRequest:
      properties:
        answer:
          enum:
            - done
            - partial
            - not_started
          type: string
      required:
        - answer
      type: object
    CreateBattleMessageRequest:
      properties:
        text:
          description: Не меньше 2 непробельных символов
          maxLength: 300
          minLength: 2
          pattern: ^[\s\S]*\S[\s\S]*\S[\s\S]*$
          type: string
      required:
        - text
      type: object
    CreateBattleQuoteRequest:
      properties:
        feedMessageId:
          type: string
      required:
        - feedMessageId
      type: object
    CreateParaphrasesRequest:
      properties:
        count:
          maximum: 5
          minimum: 1
          type: integer
      type: object
    CreatePhraseRequest:
      properties:
        author:
          type: string
        category:
          enum:
            - on_greeting
            - on_task_set
            - on_delete
            - on_vague
            - on_reminder
            - on_check_in
            - on_check_in_reply
            - on_check_in_missed
            - on_fail
            - on_excuse
            - on_excuse_denied
            - on_retry
            - on_success
            - on_absent
            - on_battle_start
            - on_break
            - on_recovery
          type: string
        combo:
          enum:
            - father_son
            - father_daughter
            - mother_son
            - mother_daughter
            - any
          type: string
        defeatLevel:
          description: Уровень побеждённости 1–4 или `any`
          enum:
            - "1"
            - "2"
            - "3"
            - "4"
            - any
          type: string
        level:
          maximum: 3
          minimum: 1
          type: integer
        role:
          enum:
            - father
            - mother
            - any
          type: string
        source:
          enum:
            - owner
            - subscriber
          type: string
        template:
          minLength: 1
          type: string
      required:
        - role
        - category
        - defeatLevel
        - combo
        - template
        - source
      type: object
    CreateShareRequest:
      properties:
